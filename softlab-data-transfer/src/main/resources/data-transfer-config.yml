data-transfer:
  data-type-mappings:
    source:
      redis:
        short: [smallint, short, int2]
        int: [integer, int]
        long: [long, bigint]
        float: [real, float]
        double: [double, double precision, decimal]
        bool: [boolean, bool]
        timestamp: [timestamp with time zone, timestamp without time zone, timestamp with timezone, timestamptz, date]
        time: [time, time with time zone, time without time zone]
        bytearray: [bytea, blob, bindata]
        uuid: [uuid]
        string: [text, string, varchar, character varying]
    destination:
      postgres:
        SMALLINT: [smallint, short, int2]
        INTEGER: [integer, int, int4]
        BIGINT: [long, bigint, int8, timestamp]
        DECIMAL: [decimal]
        REAL: [real, float, float4]
        DOUBLE PRECISION: [double, double precision, float8]
        TEXT: [text, string, varchar, character varying]
        BOOLEAN: [boolean, bool]
        BYTEA: [bytea, blob, bindata]
        TIMESTAMP WITH TIME ZONE: [date]
      sqlite:
        INTEGER: [smallint, short, integer, int, int2, int4, int8, long, bigint, boolean, bool]
        REAL: [float, real, double, double precision, decimal]
        TEXT: [text, string, varchar, character varying, uuid, timestamp, timestamptz, timestamp with time zone, timestamp without time zone, date, time, time with time zone, time without time zone]
        BLOB: [bytea, blob, bindata]
      mongo:
        double: [real, float, float4, float8, double, double precision]
        string: [text, varchar, character varying, symbol, objectid, uuid]
        bool: [boolean]
        date: [timestamp, timestamptz, timestamp with time zone, timestamp without time zone, date, time, time with time zone, time without time zone]
        int: [smallint, short, integer, int, int2, int4]
        long: [int8, long, bigint]
        binData: [bytea, blob, bindata]
        object: [object]
        array: [array]
        decimal: [decimal]
